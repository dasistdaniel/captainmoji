<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <title>Captain Moji</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="pad-left" class="pad">
      <div id="dpad">
        <button class="dbtn" data-dir="up" aria-label="Hoch"><span>▲&#xFE0E;</span></button>
        <button class="dbtn" data-dir="left" aria-label="Links"><span>▲&#xFE0E;</span></button>
        <button class="dbtn" data-dir="right" aria-label="Rechts"><span>▲&#xFE0E;</span></button>
        <button class="dbtn" data-dir="down" aria-label="Runter"><span>▲&#xFE0E;</span></button>
      </div>
    </div>

    <main id="center">
      <div id="hud">
        <span id="hud-deck">🛡️ Deck 1</span>
        <span id="hud-hp">❤️ 10/10</span>
        <span id="hud-ammo">🔋 3</span>
        <span id="hud-med">🩹 0</span>
        <span id="hud-tool">🔧 –</span>
        <button id="hud-sound" aria-label="Ton an/aus">🔊</button>
      </div>
      <div id="stage">
        <canvas id="view"></canvas>
      </div>
      <div id="log"></div>
      <div id="keys">Bewegen: Pfeile/WASD · Schießen: Leertaste/F · Medkit: E/Q · Warten: R · Ton: M</div>
    </main>

    <div id="pad-right" class="pad">
      <button class="abtn" id="btn-shoot" data-act="shoot">🔫<small>Schießen</small></button>
      <button class="abtn" id="btn-item" data-act="item">🩹<small>Item</small></button>
    </div>
  </div>

  <div id="screen" class="overlay">
    <div class="panel">
      <div id="screen-emoji" class="big">🧑‍🚀</div>
      <h1 id="screen-title">Captain Moji</h1>
      <p id="screen-text"></p>
      <button id="screen-btn">Start</button>
    </div>
  </div>

  <div id="rotate" class="overlay">
    <div class="panel">
      <div class="big">🔄</div>
      <p>Bitte Handy drehen</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
